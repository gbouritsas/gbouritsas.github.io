items:
  - id: ai_society
    nav_label: AI & Society
    title: AI & Society
    content: >
      **[Visible Machines](https://visiblemachines.gr/)** founding member:


      - **AI auditing**: data-driven NN auditing/editing via metanetworks (regulations, fairness, pruning, etc.), automated bias detection in foundation models (e.g. text-to-image).

      - **Social engagement**: AI news & science communication.
  - id: articles
    nav_label: Articles
    title: Articles
    content: >
      - "*Bias, Transparency, and Accountability of AI Systems*. Op-ed on the
      necessity of technical audits of AI algorithms. [Read more on Visible
      Machines](https://visiblemachines.gr/en/node/154) "

      - "*Exposing the Hidden Biases of AI Image Generators*. Blogpost of the ICML 2026 paper
      on adversarial bias auditing of AI image generators. [Read more on Visible
       Machines](https://visiblemachines.gr/en/exposing-hidden-biases-ai-image-generators) "

